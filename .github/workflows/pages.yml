# Publishes the exported demo site to GitHub Pages on every push to main.
#
# The site is served from https://<user>.github.io/<repo>/, not from a domain root, so the
# build needs the repository name as its base path. next.config reads it from
# NEXT_PUBLIC_BASE_PATH and the UI resolves every link and asset through withBasePath, so
# nothing else has to change.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /sitegen-landing-ui-004
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `prebuild` regenerates the site data, so this covers the whole pipeline.
      - name: Build the static export
        run: pnpm build

      # Pages serves the artifact as-is, but the marker keeps any Jekyll-aware tooling from
      # dropping the _next directory, whose name starts with an underscore.
      - name: Keep the _next directory
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
